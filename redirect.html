<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecionando para o WhatsApp | Luz &amp; Brito Advocacia</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="logo-monograma.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- Tag global (gtag) e Pixel carregam via config.js. A conversão do Google Ads dispara só nesta página. -->
<script src="config.js"></script>
<style>
:root{color-scheme:light;--navy:#0F1E38;--gold:#B8913F;--gold-2:#D9B868;--green:#1E9E54;--green-d:#178445}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--navy) url("img/hero-familia.webp") center/cover no-repeat;color:#fff;font:400 17px/1.6 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px;position:relative}
body::before{content:"";position:fixed;inset:0;background:rgba(8,16,32,.9)}
.box{position:relative;max-width:460px;width:100%;text-align:center}
.box img{height:56px;width:auto;margin:0 auto 36px;display:block}
.count{width:120px;height:120px;margin:0 auto 28px;border-radius:50%;display:grid;place-items:center;border:3px solid rgba(255,255,255,.14);position:relative;font-size:52px;font-weight:800;line-height:1}
.count::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:var(--green);animation:spin 1s linear infinite}
.count span{animation:pop .35s ease}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
h1{font-size:clamp(24px,5vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 10px}
p{margin:0;color:#C3CCDB}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:28px;min-height:54px;padding:14px 26px;border-radius:12px;background:var(--green);color:#fff;font-weight:700;text-decoration:none}
.btn:hover{background:var(--green-d)}
.btn svg{width:20px;height:20px}
.small{font-size:14px;margin-top:18px}
.small a{color:var(--gold-2)}
.notice{margin-top:24px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.08);font-size:15px;color:#DCE3EE}
@media(prefers-reduced-motion:reduce){.count::after,.count span{animation:none}}
</style>
</head>
<body>
<main class="box">
  <img src="logo-luz-brito.webp" width="671" height="176" alt="Luz &amp; Brito Advocacia">
  <div class="count" aria-live="polite"><span id="n">3</span></div>
  <h1 id="title">Recebemos seu contato!</h1>
  <p id="msg">Você será redirecionado(a) automaticamente para o atendimento no WhatsApp.</p>
  <a class="btn" id="wa" href="#" target="_top" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>Abrir o WhatsApp</a>
  <p class="small" id="fallback">Se o WhatsApp não abrir, <a id="wa2" href="#" target="_top" rel="noopener">clique aqui</a>.</p>
  <p class="notice" id="pending" hidden>O WhatsApp do escritório ainda está em configuração. Seus dados foram registrados e a equipe poderá entrar em contato.</p>
</main>
<script>
{
  const C = window.CONFIG, L = window.LB;
  let lead = {};
  try { lead = JSON.parse((L.store && L.store.getItem("lb_lead")) || "{}"); } catch (e) {}
  const q = new URLSearchParams(location.search);
  const assunto = lead.assunto || q.get("assunto") || "geral";
  const src = lead.origem_secao || q.get("src") || "lp";

  /* Conversão: dispara uma vez por envio (recarregar a página não duplica) */
  const fired = L.store && L.store.getItem("lb_lead_fired") === (lead.criado_em || "x");
  if (!fired) {
    dataLayer.push({ event: "lead", assunto, origem_secao: src, ...L.utm });
    try {
      if (window.fbq) fbq("track", "Lead", { content_name: assunto });
      if (window.gtag && C.googleAdsConversion) gtag("event", "conversion", { send_to: C.googleAdsConversion });
      if (window.gtag) gtag("event", "generate_lead", { assunto });
    } catch (e) {}
    try { L.store && L.store.setItem("lb_lead_fired", lead.criado_em || "x"); } catch (e) {}
  }

  const url = L.waLink(assunto, lead.nome, src);
  const n = document.getElementById("n");
  if (!url) {
    document.querySelector(".count").hidden = true;
    ["wa", "fallback", "msg"].forEach(id => document.getElementById(id).hidden = true);
    document.getElementById("pending").hidden = false;
  } else {
    document.getElementById("wa").href = url;
    document.getElementById("wa2").href = url;
    const go = () => {
      try { if (window.fbq) fbq("track", "Contact", { content_name: assunto }); } catch (e) {}
      try { window.top.location.href = url; } catch (e) { window.location.href = url; }
    };
    let c = C.redirectSeconds || 3;
    n.textContent = c;
    const t = setInterval(() => {
      c--;
      if (c <= 0) { clearInterval(t); n.textContent = "✓"; go(); return; }
      const s = document.createElement("span"); s.textContent = c; n.replaceChildren(s);
    }, 1000);
  }
}
</script>
</body>
</html>
